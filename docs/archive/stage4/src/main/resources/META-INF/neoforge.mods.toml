# Adapted from the official 26.1.2 MDK; see docs/PORTING_SOURCES.md.
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="WayofTime and Blood Magic contributors; independent NeoForge port contributors"
description='''
Independent Blood Magic port for Minecraft 26.1.2 / NeoForge.
Stage 3: altar multiblocks, rune bonuses, native datapack recipes and LP-based crafting.
Right-click insertion/extraction and explicit health sacrifice are available. Soul networks remain pending.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},26.1.3)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

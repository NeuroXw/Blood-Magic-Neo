# Adapted from the official Minecraft 26.1.2 MDK.
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
logoBlur=false
authors="WayofTime, NeuroXw, and Blood Magic contributors"
credits="Unofficial port. Based on Blood Magic by WayofTime. Licensed under CC-BY-4.0."
description='''
Blood Magic: Neo is an unofficial port for Minecraft 26.1.2 / NeoForge.
Includes blood altars, soul networks, the five-aspect Demon Will system,
Tartaric Gems, crystal clusters and machines, alchemy arrays, alchemy tables,
hellfire forges, 14 sigils, all 32 upstream ritual IDs and rune patterns,
the Alchemical Reaction Chamber and alchemy flasks, and 135 dungeon decoration blocks.
This alpha completes stage 1 and also implements stages 2, 4 and stage 6A of the port.
Unofficial port. Based on Blood Magic by WayofTime. Licensed under CC-BY-4.0.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},26.1.3)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"



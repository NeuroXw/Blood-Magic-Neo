# Adapted from the official 26.1.2 MDK; see docs/PORTING_SOURCES.md.
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
logoBlur=false
authors="WayofTime, NeuroXw, and Blood Magic contributors"
credits="Unofficial port. Based on Blood Magic by WayofTime. Licensed under CC-BY-4.0."
description='''
Blood Magic: Neo is an unofficial port for Minecraft 26.1.2 / NeoForge.
Includes blood altars, soul networks, six basic sigils, alchemy arrays,
alchemy tables, hellfire forges, raw demon will, and three basic rituals.
This beta implements a subset of the original mod's features.
Unofficial port. Based on Blood Magic by WayofTime. Licensed under CC-BY-4.0.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},26.1.3)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
